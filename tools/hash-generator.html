<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مولّد باسورد الموقع</title>
<style>
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
    background:#0b1020; color:#fff; padding:20px;
  }
  .box{ width:min(520px,100%); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:16px; padding:22px; }
  h1{ font-size:20px; margin:0 0 6px; }
  p{ color:rgba(255,255,255,.7); font-size:14px; line-height:1.8; }
  input{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.25); color:#fff; font-size:16px; box-sizing:border-box; margin-top:10px; }
  button{ margin-top:12px; padding:12px 16px; border-radius:12px; border:none; cursor:pointer;
    background:#ff4d8d; color:#2b0b1b; font-weight:800; font-size:15px; }
  .out{ margin-top:16px; padding:12px; border-radius:12px; background:rgba(0,0,0,.3);
    word-break:break-all; font-family:monospace; font-size:13px; color:#ffb3cc; display:none; }
  .copy{ margin-top:8px; background:rgba(255,255,255,.12); color:#fff; }
</style>
</head>
<body>
  <div class="box">
    <h1>مولّد باسورد الموقع 🔑</h1>
    <p>اكتبي الباسورد الجديد اللي عايزاه، وهيطلعلك كود (hash) تنسخيه
       وتحطيه في <code>js/config.js</code> بدل قيمة <code>passwordHash</code>.<br>
       الصفحة دي شغالة أوفلاين بالكامل وملهاش أي اتصال بالإنترنت — الباسورد
       بيتحول لكود جوه المتصفح بس ومبيتبعتش لحد.</p>
    <input id="pw" type="text" placeholder="اكتبي الباسورد الجديد هنا" autocomplete="off"/>
    <button id="go">اطلعي الكود</button>
    <div class="out" id="out"></div>
    <button class="copy" id="copyBtn" style="display:none">📋 نسخ الكود</button>
  </div>

  <script>
    async function sha256Hex(text){
      const data = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    const pw = document.getElementById("pw");
    const out = document.getElementById("out");
    const copyBtn = document.getElementById("copyBtn");

    async function run(){
      const v = pw.value;
      if(!v){ out.style.display="none"; copyBtn.style.display="none"; return; }
      const hash = await sha256Hex(v);
      out.textContent = `passwordHash: "${hash}",`;
      out.style.display = "block";
      copyBtn.style.display = "inline-block";
    }
    document.getElementById("go").addEventListener("click", run);
    pw.addEventListener("keydown", (e)=>{ if(e.key==="Enter") run(); });
    copyBtn.addEventListener("click", ()=>{
      navigator.clipboard.writeText(out.textContent);
      copyBtn.textContent = "✅ اتنسخ";
      setTimeout(()=> copyBtn.textContent = "📋 نسخ الكود", 1200);
    });
  </script>
</body>
</html>
